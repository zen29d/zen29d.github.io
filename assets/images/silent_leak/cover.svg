<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="34%" r="55%">
      <stop offset="0%" stop-color="#2DD4C6" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#2DD4C6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#2DD4C6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="drip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2DD4C6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2DD4C6" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0B0C0D"/>

  <!-- faint grid texture -->
  <g stroke="#1E2123" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="510" x2="1200" y2="510"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- padlock shackle -->
  <path d="M 540 250 L 540 210 A 60 60 0 0 1 660 210 L 660 250"
        fill="none" stroke="#8A9096" stroke-width="14" stroke-linecap="round"/>

  <!-- padlock body -->
  <rect x="500" y="250" width="200" height="160" rx="18"
        fill="#15171A" stroke="#2C2F32" stroke-width="3"/>

  <!-- keyhole -->
  <circle cx="600" cy="305" r="16" fill="#2DD4C6"/>
  <path d="M 592 316 L 608 316 L 616 350 L 584 350 Z" fill="#2DD4C6"/>

  <!-- leak drip -->
  <path d="M 600 350 C 600 400, 585 410, 585 445 C 585 470, 615 470, 615 445 C 615 415, 600 400, 600 350 Z"
        fill="url(#drip)" opacity="0.85"/>

  <!-- falling droplet -->
  <path d="M 600 480 C 600 500, 585 505, 585 522 C 585 536, 615 536, 615 522 C 615 505, 600 500, 600 480 Z"
        fill="#2DD4C6" opacity="0.55"/>

  <!-- ripple at base -->
  <ellipse cx="600" cy="562" rx="46" ry="9" fill="none" stroke="#2DD4C6" stroke-width="2" opacity="0.35"/>
  <ellipse cx="600" cy="562" rx="78" ry="15" fill="none" stroke="#2DD4C6" stroke-width="1.5" opacity="0.18"/>
</svg>
