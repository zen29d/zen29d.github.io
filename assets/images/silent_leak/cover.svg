<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="34%" r="55%">
      <stop offset="0%" stop-color="#2DD4C6" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#2DD4C6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#2DD4C6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="drip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2DD4C6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2DD4C6" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0B0C0D"/>

  <!-- faint grid texture -->
  <g stroke="#1E2123" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="510" x2="1200" y2="510"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- AI agent glyph -->
  <g>
    <line x1="330" y1="230" x2="330" y2="212" stroke="#8A9096" stroke-width="4" stroke-linecap="round"/>
    <circle cx="330" cy="206" r="6" fill="#2DD4C6"/>

    <rect x="285" y="230" width="90" height="70" rx="16"
          fill="#15171A" stroke="#8A9096" stroke-width="4"/>

    <circle cx="311" cy="263" r="9" fill="#2DD4C6"/>
    <circle cx="349" cy="263" r="9" fill="#2DD4C6"/>

    <rect x="266" y="308" width="128" height="52" rx="14"
          fill="#15171A" stroke="#2C2F32" stroke-width="3"/>
    <line x1="292" y1="330" x2="368" y2="330" stroke="#2C2F32" stroke-width="3" stroke-linecap="round"/>
    <line x1="292" y1="344" x2="340" y2="344" stroke="#2C2F32" stroke-width="3" stroke-linecap="round"/>

    <line x1="266" y1="322" x2="246" y2="312" stroke="#8A9096" stroke-width="3" stroke-linecap="round"/>
    <line x1="394" y1="322" x2="414" y2="312" stroke="#8A9096" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- padlock shackle -->
  <path d="M 540 250 L 540 210 A 60 60 0 0 1 660 210 L 660 250"
        fill="none" stroke="#8A9096" stroke-width="14" stroke-linecap="round"/>

  <!-- padlock body -->
  <rect x="500" y="250" width="200" height="160" rx="18"
        fill="#15171A" stroke="#2C2F32" stroke-width="3"/>

  <!-- keyhole -->
  <circle cx="600" cy="305" r="16" fill="#2DD4C6"/>
  <path d="M 592 316 L 608 316 L 616 350 L 584 350 Z" fill="#2DD4C6"/>

  <!-- wave of bits: agent to keyhole -->
  <g font-family="ui-monospace, Consolas, monospace" font-size="16" fill="#2DD4C6" font-weight="700">
    <text x="410" y="300" opacity="0.30">1</text>
    <text x="431" y="316" opacity="0.38">0</text>
    <text x="452" y="296" opacity="0.46">1</text>
    <text x="473" y="314" opacity="0.54">1</text>
    <text x="494" y="298" opacity="0.62">0</text>
    <text x="515" y="312" opacity="0.70">1</text>
    <text x="536" y="300" opacity="0.78">0</text>
    <text x="557" y="310" opacity="0.86">1</text>
    <text x="578" y="300" opacity="0.94">0</text>
  </g>

  <!-- leak drip -->
  <path d="M 600 350 C 600 400, 585 410, 585 445 C 585 470, 615 470, 615 445 C 615 415, 600 400, 600 350 Z"
        fill="url(#drip)" opacity="0.85"/>

  <!-- falling droplet -->
  <path d="M 600 480 C 600 500, 585 505, 585 522 C 585 536, 615 536, 615 522 C 615 505, 600 500, 600 480 Z"
        fill="#2DD4C6" opacity="0.55"/>

  <!-- ripple at base -->
  <ellipse cx="600" cy="562" rx="46" ry="9" fill="none" stroke="#2DD4C6" stroke-width="2" opacity="0.35"/>
  <ellipse cx="600" cy="562" rx="78" ry="15" fill="none" stroke="#2DD4C6" stroke-width="1.5" opacity="0.18"/>
</svg>
